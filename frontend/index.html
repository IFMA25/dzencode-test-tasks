<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Test task for DzenCode" />
    <title>Test task for DzenCode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #ebeff3;
        "
      >
        <svg width="64" height="64" viewBox="0 0 50 50">
          <circle cx="25" cy="25" r="20" fill="none" stroke="#e5e7eb" stroke-width="5" />
          <circle
            cx="25"
            cy="25"
            r="20"
            fill="none"
            stroke="#73b826"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="80 45"
          >
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 25 25"
              to="360 25 25"
              dur="0.8s"
              repeatCount="indefinite"
            />
          </circle>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
